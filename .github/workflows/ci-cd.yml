name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ---------------------------------------------
  # Back-end API - Lints / Tests / Docker Build
  # ---------------------------------------------
  build-and-test-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          JWT_SECRET: "12345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678"
          DB_HOST: "localhost"
          DB_USER: "root"
          DB_PASSWORD: "password"
          DB_NAME: "agriconnect_test"

      - name: Build and Test Docker Container
        run: docker build -t agriconnect-api:${{ github.sha }} .
        # In the future, you push the tag to Azure Container Registry or GitHub Packages here.

  # ---------------------------------------------
  # Front-end UI - Lints / Tests / Docker Build
  # ---------------------------------------------
  build-and-test-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Source (Dry Run)
        run: npm run build
        env:
          VITE_API_URL: https://api.yourdomain.com/api # Placeholder for CI build validation
          VITE_SOCKET_URL: https://api.yourdomain.com

      - name: Build and Test Docker Container
        run: |
          docker build \
          --build-arg VITE_API_URL="https://api.test.com/api" \
          --build-arg VITE_SOCKET_URL="https://api.test.com" \
          -t agriconnect-web:${{ github.sha }} .
        # Push to Azure Container Registry (ACR) when doing CD

  # ---------------------------------------------
  # Continuous Deployment (CD) - Deploy to Azure VM
  # ---------------------------------------------
  deploy-to-azure-vm:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-test-frontend]
    # Only run this step if code is pushed to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH into VM and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/AgriConnect
            # Pull the latest code
            git pull origin main
            # Stop the containers, build, and restart in the background
            sudo docker-compose down
            sudo docker-compose up --build -d
