services:
  database:
    image: mysql:8.0
    container_name: agri_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agriconnect
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: agri_backend
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "5005:5005"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=agriconnect
      - PORT=5005
      - JWT_SECRET=your_dev_secret_key_123456789012345678901
      - JWT_EXPIRE=7d
      - NODE_ENV=development # Switch to production in prod
      - FRONTEND_URL=http://localhost
    command: >
      sh -c "npm run db:ensure && npm run migrate && npm run seed && npm run seed:demo && node server.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    container_name: agri_frontend
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  db_data:
