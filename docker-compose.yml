version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: agri_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: agriconnect
    ports:
      - "3307:3306" # Mapped to 3307 locally to prevent collision if dev mysql is running
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: agri_backend
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "5005:5005"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=agriconnect
      - PORT=5005
      - JWT_SECRET=your_dev_secret_key_12345
      - JWT_EXPIRE=7d
      - NODE_ENV=development # Switch to production in prod
      - FRONTEND_URL=http://localhost:5173
    command: >
      sh -c "npm run db:ensure && npm run migrate && npm run seed && node server.js"

  frontend:
    build:
      context: ./frontend
      # Pass localhost backend into the frontend bundle
      args:
        VITE_API_URL: http://localhost:5005/api
        VITE_SOCKET_URL: http://localhost:5005
    container_name: agri_frontend
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  db_data:
